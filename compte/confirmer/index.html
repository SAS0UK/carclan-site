<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Confirmer votre adresse · CarClan</title>
    <meta name="description" content="Confirmez votre adresse pour finir votre inscription à CarClan." />
    <meta name="theme-color" content="#0f0e0c" />
    <meta name="color-scheme" content="dark" />
    <!-- Une page de passage, liée seulement depuis un e-mail de l'app : rien à
         indexer, et l'adresse porte le jeton, qui ne doit partir vers aucun
         site. Pas dans /rasso/* ni /r/* : l'app ne la capte pas, la page
         s'affiche toujours. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/icone-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html { background: #0f0e0c; }
      body { margin: 0; }
      .confirmer { max-width: 34rem; }
      .confirmer .btn { margin-top: 32px; }
      .confirmer [data-etat] { min-height: 24px; margin-top: 16px; }
      .confirmer [data-titre]:focus { outline: none; }
    </style>
    <script type="module" src="/src/compte-confirmer.js"></script>
  </head>
  <body>
    <header class="legal-topbar">
      <a class="marque" href="/" aria-label="CarClan, accueil">
        <img src="/le-maillon.svg" alt="" width="28" height="28" />
        <span class="t-marque">CARCLAN</span>
      </a>
      <a class="retour" href="/"><svg class="ic" aria-hidden="true"><use href="#cc-suivant" /></svg>Retour au site</a>
    </header>

    <main id="doc" class="doc">
      <div class="doc-tete confirmer">
        <p class="t-surtitre">Votre compte</p>
        <h1 class="t-affiche" data-titre tabindex="-1">Plus qu’un geste.</h1>
        <p class="chapeau" data-chapeau>Touchez le bouton pour confirmer votre adresse. Vous reviendrez ensuite dans l’app CarClan pour vous connecter.</p>
        <button class="btn btn-ambre" type="button" data-confirmer><span data-libelle>Confirmer mon adresse</span></button>
        <p class="chapeau" data-etat aria-live="polite"></p>
      </div>
    </main>
  </body>
</html>
