<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarClan · QR code</title>
    <!-- Une adresse facile à dire sur un rasso : carclan.fr/qr ouvre
         l'accueil sur son QR code, pour que chacun s'inscrive sur son propre
         téléphone. Pas d'indexation, c'est un raccourci. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f0e0c" />
    <link rel="canonical" href="https://carclan.fr/" />
    <meta http-equiv="refresh" content="0; url=/#qr" />
    <style>html,body{margin:0;background:#0f0e0c;color:#f3efe8;font:16px/1.4 -apple-system,sans-serif}a{color:#e2a21f}p{padding:24px}</style>
  </head>
  <body>
    <script>location.replace('/#qr');</script>
    <p><a href="/#qr">Afficher le QR code de carclan.fr</a></p>
  </body>
</html>
